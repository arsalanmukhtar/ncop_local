<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NCOP - Offline</title>
  <style>
    body {
      font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      color: #e5e7eb
    }

    .card {
      max-width: 520px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      background: rgba(255, 255, 255, .06)
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px
    }

    p {
      margin: 0 0 16px;
      opacity: .85;
      line-height: 1.5
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>You’re offline</h1>
    <p>NCOP couldn’t reach the network. If you previously opened this page, some content may still be available.</p>
    <a class="btn" href="/">Try again</a>
  </div>
</body>

</html>
